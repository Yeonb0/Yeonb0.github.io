name: Publish Notion Page (queue)

# notion-publish 플러그인이 _notion_queue/<page-id>.yml 을 커밋하면 실행
on:
  push:
    branches:
      - main
    paths:
      - "_notion_queue/**.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Notion 페이지 URL (직접 실행할 때)"
        required: false

# 6시간 주기 동기화 (notion.yml) 와 같은 그룹으로 묶어 push 충돌 방지
concurrency:
  group: notion-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install notion-client==2.2.1 requests pyyaml

      - name: Convert requested pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_URL: ${{ github.event.inputs.url }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            python scripts/notion_to_md.py --page "$PAGE_URL"
          else
            python scripts/notion_to_md.py --queue _notion_queue
          fi

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "notion-bot"
          git config --global user.email "bot@github.com"
          git add _posts assets/images/notion _notion_queue
          git commit -m "Publish Notion page" || exit 0
          git pull --rebase
          git push
